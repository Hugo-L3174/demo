name: Build and deploy mc_rtc web demo

on:
  # push:
  #   branches:
  #     - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Compilation
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload website artifacts
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4